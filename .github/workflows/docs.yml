name: Docs

# Checks that the committed class reference still matches the source.
#
# Read the Docs cannot run Godot, so it only renders reStructuredText that is already in the
# repo, which means the generated pages have to be committed. This job used to regenerate them
# and push the result back to main. That worked, but it meant every push moved the branch under
# whoever pushed it, and the pages on Read the Docs were wrong for as long as the job took to
# run. It verifies now, and regenerating is a step you do before committing:
#
#     python docs/build_docs.py --skip-html

on:
  push:
    branches: [main]
    paths:
      - "addons/**"
      - "docs/**"
      - ".readthedocs.yaml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs
  cancel-in-progress: false

env:
  GODOT_VERSION: "4.7.1"

jobs:
  classref:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Check the YAML has no tabs
        # Opening one of these in Godot's script editor is enough to break it. Godot re-saves the
        # files it has open using its own indentation, which is tabs, and YAML rejects a tab
        # outright. Read the Docs then fails one second into the build with a single line of output
        # and serves the previous version, so the site reads as merely stale.
        #
        # First step in the job because it costs nothing and the rest of this takes minutes.
        run: |
          bad=$(grep -lP '\t' .readthedocs.yaml .github/workflows/*.yml || true)
          if [ -z "$bad" ]; then
            echo "No tabs in the YAML."
            exit 0
          fi

          echo "::error::A tab character reached YAML, which cannot be parsed with one."
          echo
          echo "Godot rewrites files it has open in the script editor. Close these there, then:"
          echo
          for f in $bad; do
            echo "    $f"
            grep -nP '\t' "$f" | sed 's/^/        /'
          done
          exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the doc comments
        # Needs no Godot and no Sphinx, so it runs before either is installed.
        run: python docs/check_doc_style.py

      - name: Install Sphinx
        run: pip install -r docs/requirements.txt

      - name: Install Godot
        run: |
          base="Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          curl -fsSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${base}.zip"
          unzip -q godot.zip
          sudo mv "$base" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          godot --version

      - name: Import the project
        # doctool documents whatever is in the class cache, and the cache only exists after an
        # import pass. The second pass is not superstition: the first one registers the scripts
        # and the second picks up class names that resolve against them.
        run: |
          godot --headless --path . --editor --quit || true
          godot --headless --path . --editor --quit || true

      - name: Build
        # The HTML this produces is not published anywhere. It runs so a broken Sphinx build
        # fails here rather than turning up on Read the Docs later.
        run: python docs/build_docs.py

      - name: Check the class reference is current
        run: |
          if git diff --quiet -- docs/web; then
            echo "Class reference matches the source."
            exit 0
          fi

          echo "::error::The committed class reference does not match the ## comments in the source."
          echo
          echo "Regenerate it and commit the result:"
          echo
          echo "    python docs/build_docs.py --skip-html"
          echo
          git diff --stat -- docs/web
          exit 1

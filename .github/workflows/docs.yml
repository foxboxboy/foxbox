name: Docs

# Regenerates the class reference and commits it back, so Read the Docs has something to build.
#
# Read the Docs cannot run Godot, so it only renders reStructuredText that is already in the
# repo. This job does the Godot half and pushes the result. It is the same arrangement the
# engine's own documentation uses, with the sync automated rather than done by hand.

on:
  push:
    branches: [main]
    paths:
      - "addons/**"
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs
  cancel-in-progress: false

env:
  GODOT_VERSION: "4.7.1"

jobs:
  classref:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Sphinx
        run: pip install -r docs/requirements.txt

      - name: Install Godot
        run: |
          base="Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          curl -fsSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${base}.zip"
          unzip -q godot.zip
          sudo mv "$base" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          godot --version

      - name: Import the project
        # doctool documents whatever is in the class cache, and the cache only exists after an
        # import pass. The second pass is not superstition: the first one registers the scripts
        # and the second picks up class names that resolve against them.
        run: |
          godot --headless --path . --editor --quit || true
          godot --headless --path . --editor --quit || true

      - name: Build
        # The HTML this produces is not published anywhere. It runs so a broken Sphinx build
        # fails here rather than turning up on Read the Docs later.
        run: python docs/build_docs.py

      - name: Commit the class reference
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/web/class_*.rst docs/web/module_*.rst
          if git diff --cached --quiet; then
            echo "Class reference unchanged."
            exit 0
          fi
          # [skip ci] matters. This push touches docs/, which is what triggers the workflow,
          # so without it the job would retrigger itself forever.
          git commit -m "Regenerate the class reference [skip ci]"
          git push

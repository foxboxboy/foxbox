# Read the Docs build config. Connect the repo at https://readthedocs.org and it publishes on
# every push to main.
#
# Read the Docs cannot run Godot, so it cannot regenerate the class pages. It builds whatever
# reStructuredText is committed. To publish an update:
#
#     python docs/build_docs.py --skip-html
#     git add -f docs/web/class_*.rst docs/web/module_*.rst
#     git commit
#
# The -f is needed because generated pages are gitignored for local builds.

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/web/conf.py
  fail_on_warning: false

python:
  install:
    - requirements: docs/requirements.txt

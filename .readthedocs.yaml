# Read the Docs build config. Connect the repo at https://readthedocs.org and it publishes on
# every push to main.
#
# Read the Docs cannot run Godot, so it cannot regenerate the class pages. It builds whatever
# reStructuredText is committed, which is why docs/web/class_*.rst and module_*.rst are tracked.
#
# Regenerate them yourself when you change a ## comment, with
#
#     python docs/build_docs.py --skip-html
#
# and commit the result. .github/workflows/docs.yml checks that you did and fails if not.

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/web/conf.py
  fail_on_warning: false

python:
  install:
    - requirements: docs/requirements.txt
